# Local Postgres for dev.
# Requires Docker Desktop. If you don't have Docker, see infra/README.md
# for free-tier cloud alternatives (Supabase).
#
# NOTE: Redis was removed — the queue moved from BullMQ/Redis to Postgres
# polling (see engagement-worker.ts). No Redis dependency remains.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smm
    ports:
      - "5432:5432"
    volumes:
      - smm_pg_data:/var/lib/postgresql/data

volumes:
  smm_pg_data:
