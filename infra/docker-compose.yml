# Local Postgres + Redis for dev.
# Requires Docker Desktop. If you don't have Docker, see infra/README.md
# for free-tier cloud alternatives (Supabase + Upstash).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smm
    ports:
      - "5432:5432"
    volumes:
      - smm_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - smm_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  smm_pg_data:
  smm_redis_data:
